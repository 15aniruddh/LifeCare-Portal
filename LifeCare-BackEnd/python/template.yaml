AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  LifeCare Portal API - the whole FastAPI app on one Lambda function.
  Designed to sit inside the AWS free tier: no EC2, no NAT gateway, no ECR,
  no API Gateway, no provisioned concurrency. Nothing here bills while idle.
  Deployed by .github/workflows/backend.yml on every push to master.

Parameters:
  Env:
    Type: String
    Default: production
    AllowedValues: [dev, staging, production]
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: >
      postgresql://user:pass@host/lifecare?sslmode=require - use a serverless
      Postgres that scales to zero (Neon, Supabase). RDS is billed per hour
      whether or not anyone calls the API.
  SecretKey:
    Type: String
    NoEcho: true
    Description: JWT signing key, 32+ random characters.
  CorsOrigins:
    Type: String
    Description: Comma-separated frontend origins. "*" is refused when Env is staging/production.
  FrontendBaseUrl:
    Type: String
    Default: http://localhost:3000
  MaxConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >
      Hard ceiling on simultaneous executions. The Function URL is public, so
      this caps how fast a bad actor - or a loop in the frontend - can spend
      money; excess requests get a 429 instead of a bill.
      0 means "do not set it", which is required on a new account: AWS refuses
      any reservation that drops unreserved concurrency below 10, and a fresh
      account's entire limit is 10. The account limit then serves as the cap.
      Set this to 5 once a Lambda concurrency quota increase comes through.
  GoogleClientId:
    Type: String
    Default: ""
    Description: >
      OAuth 2.0 Web application client ID from the Google Cloud console. Not a
      secret - it travels in the authorisation URL the browser follows.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      The matching client secret. This stays server-side: it is exchanged for
      tokens by the Lambda and must never reach the browser bundle.
  GoogleRedirectUri:
    Type: String
    Default: ""
    Description: >
      Must equal an "Authorised redirect URI" registered on that Google client,
      character for character, and must be this API's own callback -
      <function url>/login/google/callback. It cannot be derived from the
      Function URL inside this template: the URL is created from the function,
      so referencing it here would be a circular dependency.
  AlertEmail:
    Type: String
    Default: ""
    Description: >
      Turns on the abuse guardrails below. Leave empty to deploy without them.
      You must click the confirmation link SNS emails you, or no alert is
      delivered and the auto-throttle still fires silently.
  InvocationAlarmThreshold:
    Type: Number
    Default: 3000
    Description: >
      Invocations in 5 minutes that count as an attack. The account's
      concurrency limit of 10 caps real throughput near 15,000 per 5 minutes,
      and ordinary personal use is a few hundred per day, so 3000 is far above
      anything legitimate and far below anything expensive.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: >
      Lambda's default is "never expire", which bills for stored logs forever.

Conditions:
  CapConcurrency: !Not [!Equals [!Ref MaxConcurrency, 0]]
  Guarded: !Not [!Equals [!Ref AlertEmail, ""]]
  # All three must be present. Half-configured Google sign-in makes the app
  # refuse to start, by design (see Settings.validate_for_runtime).
  GoogleReady: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]
    - !Not [!Equals [!Ref GoogleRedirectUri, ""]]

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # Build with the Makefile target below rather than a requirements.txt, so
      # pyproject.toml stays the single list of dependencies.
      BuildMethod: makefile
    Properties:
      # A zip package, not a container image: images live in ECR, which bills
      # for storage per GB-month and keeps every version you ever deployed.
      # A zip is stored in S3 for a few cents a year.
      PackageType: Zip
      CodeUri: .
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      # Graviton - 20% cheaper per GB-second than x86, same code.
      Architectures: [arm64]
      # Lambda scales CPU with memory, and you are billed memory x duration.
      # Most requests here wait on Postgres rather than the CPU, so more memory
      # would cost more without finishing sooner. Raise it only if logins (bcrypt,
      # the one CPU-bound path) feel slow.
      MemorySize: 512
      # A ceiling, not a target - you are billed for actual duration. It exists
      # so a wedged request stops at 15s instead of burning the full 15 minutes.
      Timeout: 15
      # Omitted entirely when MaxConcurrency is 0 - CloudFormation drops a
      # property set to AWS::NoValue rather than sending a zero reservation,
      # which would throttle the function to nothing.
      ReservedConcurrentExecutions:
        !If [CapConcurrency, !Ref MaxConcurrency, !Ref "AWS::NoValue"]
      Environment:
        Variables:
          ENV: !Ref Env
          DATABASE_URL: !Ref DatabaseUrl
          SECRET_KEY: !Ref SecretKey
          CORS_ORIGINS: !Ref CorsOrigins
          FRONTEND_BASE_URL: !Ref FrontendBaseUrl
          LOG_JSON: "true"
          # The login page asks GET /login/providers whether to render the
          # Google button; it stays hidden until all three values arrive here.
          GOOGLE_OAUTH_ENABLED: !If [GoogleReady, "true", "false"]
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
      # A Function URL is free; API Gateway would add ~$1 per million requests
      # and a REST API's minimum charges on top of Lambda's own.
      # This is why the stack lives in ap-south-1 (Mumbai) and not ap-south-2
      # (Hyderabad): Function URLs do not exist in ap-south-2 - the Lambda API
      # there has no GetFunctionUrlConfig operation, and CloudFormation has no
      # AWS::Lambda::Url resource type. Moving the region back means paying for
      # API Gateway.
      # CORS is handled by the app's own middleware, so none is configured here -
      # two layers would emit duplicate Access-Control-Allow-Origin headers.
      FunctionUrlConfig:
        AuthType: NONE

  # Declared explicitly only to set retention. Left implicit, Lambda creates
  # this group with "Never expire" and you pay to store logs indefinitely.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  # ---- Abuse guardrails ------------------------------------------------
  # The Function URL is public and AWS has no hard spend cap, so the answer to
  # "someone points a script at it" is: notice within 5 minutes, and throttle
  # the function to zero without waiting for a human. Every resource here is
  # inside a free tier - 10 CloudWatch alarms, 1,000 SNS emails a month, and a
  # throttler that only ever runs during an actual incident.

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: Guarded
    Properties:
      DisplayName: LifeCare API alarms

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: Guarded
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  InvocationSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Guarded
    Properties:
      AlarmDescription: Invocation rate far above anything this project generates.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref InvocationAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      # Missing data means no traffic at all, which is the normal resting state.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ThrottlerRole:
    Type: AWS::IAM::Role
    Condition: Guarded
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: throttle-the-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Exactly one verb on exactly one function. This role cannot read
              # data, invoke anything, or touch any other resource.
              - Effect: Allow
                Action: lambda:PutFunctionConcurrency
                Resource: !GetAtt ApiFunction.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*"

  Throttler:
    Type: AWS::Lambda::Function
    Condition: Guarded
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ThrottlerRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TARGET_FUNCTION: !Ref ApiFunction
      Code:
        ZipFile: |
          """Sets the API's reserved concurrency to 0, which stops every new
          invocation immediately. Reserving 0 is permitted even on an account
          whose whole concurrency limit is 10, unlike reserving a positive
          number - so this works today, without a quota increase.

          Recover with:
            aws lambda delete-function-concurrency --function-name <fn>
          """
          import os
          import boto3

          def handler(event, context):
              target = os.environ["TARGET_FUNCTION"]
              boto3.client("lambda").put_function_concurrency(
                  FunctionName=target,
                  ReservedConcurrentExecutions=0,
              )
              print(f"Throttled {target} to zero concurrency")
              return {"throttled": target}

  ThrottlerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: Guarded
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Throttler}"
      RetentionInDays: !Ref LogRetentionDays

  ThrottlerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: Guarded
    Properties:
      FunctionName: !GetAtt Throttler.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertTopic

  # SNS fans the alarm out to both the email and the throttler. SNS retries a
  # failed Lambda delivery with backoff, which matters here: under a real flood
  # the throttler is competing for the same account concurrency pool as the API.
  ThrottlerSubscription:
    Type: AWS::SNS::Subscription
    Condition: Guarded
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: lambda
      Endpoint: !GetAtt Throttler.Arn

Outputs:
  GoogleSignIn:
    Description: Whether the login page will show the Google button.
    Value: !If [GoogleReady, "enabled", "OFF - set the GoogleClient* parameters"]
  GoogleCallbackToRegister:
    Description: Register this exact URL in the Google console's Authorised redirect URIs.
    Value: !Sub ["${u}login/google/callback", {u: !GetAtt ApiFunctionUrl.FunctionUrl}]
  GuardrailStatus:
    Description: Whether the abuse guardrails are active.
    Value: !If [Guarded, "armed", "OFF - set AlertEmail to enable"]
  ApiUrl:
    Description: Base URL of the API. Point the frontend's API base URL here.
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
