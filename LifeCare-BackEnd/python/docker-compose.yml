services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifecare}
      POSTGRES_USER: ${POSTGRES_USER:-lifecare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifecare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifecare} -d ${POSTGRES_DB:-lifecare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
