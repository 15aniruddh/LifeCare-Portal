services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifecare}
      POSTGRES_USER: ${POSTGRES_USER:-lifecare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifecare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifecare} -d ${POSTGRES_DB:-lifecare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "9091:9091"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 9091 --workers 4
             --proxy-headers --forwarded-allow-ips '*'"

volumes:
  pgdata:
