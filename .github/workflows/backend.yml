# Workflows must live at the repository root, never inside a project folder -
# GitHub only reads .github/workflows/. The monorepo is handled by the `paths`
# filters below (this job ignores the frontend, the docs and the old Java
# backend entirely) and by `working-directory`, which makes every `run` step
# behave as if it were launched from LifeCare-BackEnd/python.
name: Backend

on:
  push:
    branches: [master]
    paths:
      - "LifeCare-BackEnd/python/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "LifeCare-BackEnd/python/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: # lets you deploy by hand from the Actions tab

defaults:
  run:
    working-directory: LifeCare-BackEnd/python

# Two pushes in quick succession would otherwise race each other into the same
# CloudFormation stack. Never cancel a deploy mid-flight, only a queued one.
# ap-south-1 (Mumbai) is not a preference, it is a requirement: Lambda Function
# URLs do not exist in ap-south-2 (Hyderabad), and the CloudFront origin hostname
# is built from the stack's own region. The `||` default means a missing or
# deleted AWS_REGION variable still lands in Mumbai instead of failing or, worse,
# deploying somewhere else.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET || 'lifecare-portal-artifacts-635738234790' }}

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests scripts
      - run: mypy app
      - run: pytest -q

  deploy:
    needs: test
    # Pull requests run the tests but must never touch AWS. The OIDC trust
    # policy pins the branch as well, so this is belt and braces.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # No `environment:` here on purpose. Declaring one rewrites the OIDC subject
    # claim from repo:OWNER/REPO:ref:refs/heads/master to
    # repo:OWNER/REPO:environment:<name>, which no longer matches the branch
    # condition github-oidc.yaml pins the role to.
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The function is built for arm64 but GitHub's free runners are x86, so
      # `sam build --use-container` needs emulation to run the arm64 build image.
      # Swapping template.yaml to Architectures: [x86_64] would remove this step
      # at the cost of ~20% more per GB-second.
      - uses: docker/setup-qemu-action@v3

      # Schema first: the new code may expect columns the database lacks. If
      # this fails the deploy is skipped and the old function keeps serving.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -e .
          alembic upgrade head

      - run: sam build --use-container

      - name: Deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # A secret, not a variable: variables are readable by anyone who can
          # see the repository settings, and this one buys account access.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
        run: |
          params=(
            Env="${{ vars.APP_ENV }}"
            DatabaseUrl="${{ secrets.DATABASE_URL }}"
            SecretKey="${{ secrets.APP_SECRET_KEY }}"
            CorsOrigins="${{ vars.CORS_ORIGINS }}"
            FrontendBaseUrl="${{ vars.FRONTEND_BASE_URL }}"
          )
          # SAM rejects `Key=` with an empty value outright, so the guardrail
          # parameter is only passed when ALERT_EMAIL is actually set. Unset it
          # and the stack still deploys, just without the alarm and throttler.
          if [ -n "$ALERT_EMAIL" ]; then
            params+=(AlertEmail="$ALERT_EMAIL")
          fi
          # Same reason - SAM rejects an empty value, and Google sign-in is
          # all-or-nothing, so pass the trio only when all three are present.
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ] && [ -n "$GOOGLE_REDIRECT_URI" ]; then
            params+=(
              GoogleClientId="$GOOGLE_CLIENT_ID"
              GoogleClientSecret="$GOOGLE_CLIENT_SECRET"
              GoogleRedirectUri="$GOOGLE_REDIRECT_URI"
            )
          fi

          sam deploy \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --capabilities CAPABILITY_IAM \
            --s3-bucket "${{ env.ARTIFACT_BUCKET }}" \
            --s3-prefix backend \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${params[@]}"

      - name: Show the API URL and check it answers
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ vars.STACK_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)
          echo "API: $URL"
          curl --fail --silent --show-error "${URL%/}/health"
          echo "### Deployed: ${URL%/}" >> "$GITHUB_STEP_SUMMARY"
