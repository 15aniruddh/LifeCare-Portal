server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: every unknown path is a client-side route, so hand back
  # index.html and let React Router resolve it. Without this, reloading on
  # /login/google/callback or /userdashboard returns a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so these can be cached indefinitely.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy leaves browsers loading the
  # old bundle names.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
